pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Mapbox SDK Maven registry -- needs SDK_REGISTRY_TOKEN
        // in ~/.gradle/gradle.properties (see android/README.md)
        maven {
            url "https://api.mapbox.com/downloads/v2/releases/maven"
            authentication { basic(BasicAuthentication) }
            credentials {
                username = "mapbox"
                password = providers.gradleProperty("SDK_REGISTRY_TOKEN")
                    .orElse(providers.environmentVariable("SDK_REGISTRY_TOKEN"))
                    .getOrElse("")
            }
        }
    }
}
rootProject.name = "PBCPlumeTracker"
include ":app"
